# The release. This repository mirrors the SDK from the Metzia platform, where
# each version is set. A push to main runs this workflow, and it publishes when
# package.json names a version npm does not hold yet. A push that keeps the
# version publishes nothing.
#
# The publish holds no npm token. npm trusts this workflow directly (Trusted
# Publishing): GitHub hands the job a short-lived OIDC identity, and npm checks
# it against the trusted publisher set on the package, metziaai/metzia-sdk and
# release.yml. Renaming this file breaks that link until the npm setting moves
# with it. The same identity signs the provenance statement.
#
# The repository variable SDK_RELEASE set to `publish` turns the job on.

name: Release

on:
  push:
    branches: [main]
  # Run it by hand to publish a version already on main.
  workflow_dispatch:

# Two runs at once would race on the publish and the tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ vars.SDK_RELEASE == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The tag and the GitHub release.
      contents: write
      # The Trusted Publishing identity and the provenance statement.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Node 24 ships npm 11, and Trusted Publishing needs npm 11.5.1 or later.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check the npm version
        run: |
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error('npm '+process.argv[1]+' cannot use Trusted Publishing. It needs 11.5.1 or later.'); process.exit(1) }" "$(npm --version)"

      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if npm view "@metzia/sdk@${version}" version >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "npm already holds @metzia/sdk@${version}. Nothing to publish."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "@metzia/sdk@${version} is new. Publishing it."
          fi

      - if: steps.version.outputs.new == 'true'
        run: npm ci

      - name: Test the SDK
        if: steps.version.outputs.new == 'true'
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
          npm test
          npm run smoke

      - name: Publish to npm
        if: steps.version.outputs.new == 'true'
        run: npm publish

      # The release notes are the version's section of CHANGELOG.md.
      - name: Tag and create the GitHub release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          awk -v heading="## ${VERSION}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "v${VERSION}" --target "${GITHUB_SHA}" --title "v${VERSION}" --notes-file release-notes.md
