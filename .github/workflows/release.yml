# The release. A push to main that changes the SDK or a changeset runs it, and
# the Changesets action then does one of two things:
#
# 1. A changeset is pending. The action opens or updates the version pull
#    request, "chore: release the SDK". `npm run version-packages` moves the
#    version in package.json and src/version.ts, writes CHANGELOG.md, updates
#    the lockfile, and deletes the changesets.
# 2. No changeset is pending, which is the push that merges the version pull
#    request. The action publishes each version npm does not hold yet, pushes
#    the tag, and creates the GitHub release.
#
# The repository variable SDK_RELEASE turns each part on. Unset, the workflow
# skips. `version` opens the version pull request and publishes nothing.
# `publish` does both.
#
# The publish holds no npm token. npm trusts this workflow directly (Trusted
# Publishing): GitHub hands the job a short-lived OIDC identity, and npm checks
# it against the trusted publisher set on the package, metziaai/metzia-sdk and
# release.yml. Renaming this file breaks that link until the npm setting moves
# with it. The same identity signs the provenance statement.

name: Release

on:
  push:
    branches: [main]
  # Run it by hand after changing SDK_RELEASE, so a version already on main
  # publishes with no new push.
  workflow_dispatch:

# Two runs at once would race on the version branch and on the publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ vars.SDK_RELEASE == 'version' || vars.SDK_RELEASE == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The version commit, the tag, and the GitHub release.
      contents: write
      # The version pull request.
      pull-requests: write
      # The npm provenance statement.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Node 24 ships npm 11, and Trusted Publishing needs npm 11.5.1 or later.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check the npm version
        run: |
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error('npm '+process.argv[1]+' cannot use Trusted Publishing. It needs 11.5.1 or later.'); process.exit(1) }" "$(npm --version)"

      - run: npm ci

      - name: Test the SDK
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
          npm test
          npm run smoke

      # An empty publish script publishes nothing, so SDK_RELEASE=version stops
      # after the version pull request.
      - uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          publish-script: ${{ vars.SDK_RELEASE == 'publish' && 'npm run release' || '' }}
          pr-title: "chore: release the SDK"
          commit-message: "chore: release the SDK"
        env:
          GITHUB_TOKEN: ${{ github.token }}
